blueprint:
  name: Room Light State Machine v2
  description: Room lighting automation with motion and manual toggle support.

  domain: automation

  input:
    room_state:
      name: Room State Helper
      selector:
        entity:
          domain: input_select

    light_target:
      name: Light Target
      selector:
        target:
          entity:
            domain: light

    motion_sensor:
      name: Motion Sensor or Group
      selector:
        entity:
          filter:
            - domain: binary_sensor
            - domain: group

    toggle_device:
      name: Toggle Device
      description: Ubisys D1 dimmer/button device.
      selector:
        device: {}

    no_motion_wait:
      name: No Motion Wait Time
      default: 300
      selector:
        number:
          min: 0
          max: 3600
          unit_of_measurement: seconds
          mode: box

    lux_sensor:
      name: Lux Sensor
      default: ""
      selector:
        entity:
          domain: sensor

    lux_limit:
      name: Lux Limit
      default: 0
      selector:
        number:
          min: 0
          max: 10000

    low_brightness_value:
      name: Low Light Brightness %
      default: 20
      selector:
        number:
          min: 1
          max: 100

mode: restart

variables:
  room_state_entity: !input room_state
  lux_sensor_entity: !input lux_sensor
  lux_limit: !input lux_limit

triggers:
  - trigger: state
    entity_id: !input motion_sensor
    to: "on"
    id: motion_on

  - trigger: state
    entity_id: !input motion_sensor
    to: "off"
    for:
      seconds: !input no_motion_wait
    id: motion_off

  - trigger: state
    entity_id: !input room_state
    id: room_state_changed

  - trigger: device
    device_id: !input toggle_device
    domain: mqtt
    type: action
    subtype: toggle_s2_action
    id: manual_toggle

conditions: []

actions:
  - choose:

      - conditions:
          - condition: trigger
            id: manual_toggle
          - condition: template
            value_template: >
              {{ states(room_state_entity) == 'Off' }}
        sequence:
          - action: input_select.select_option
            target:
              entity_id: !input room_state
            data:
              option: "On"

      - conditions:
          - condition: trigger
            id: manual_toggle
          - condition: template
            value_template: >
              {{ states(room_state_entity) in ['On', 'LowLights'] }}
        sequence:
          - action: input_select.select_option
            target:
              entity_id: !input room_state
            data:
              option: "Off"

      - conditions:
          - condition: trigger
            id: motion_on
          - condition: template
            value_template: >
              {{ states(room_state_entity) == 'Off' }}
          - condition: template
            value_template: >
              {{
                lux_limit | int(0) == 0
                or lux_sensor_entity == ''
                or states(lux_sensor_entity) | float(0) < lux_limit | float(0)
              }}
        sequence:
          - action: input_select.select_option
            target:
              entity_id: !input room_state
            data:
              option: "On"

      - conditions:
          - condition: trigger
            id: motion_off
          - condition: template
            value_template: >
              {{ states(room_state_entity) == 'On' }}
        sequence:
          - action: input_select.select_option
            target:
              entity_id: !input room_state
            data:
              option: "LowLights"

      - conditions:
          - condition: trigger
            id: room_state_changed
          - condition: template
            value_template: >
              {{ trigger.to_state.state == 'Off' }}
        sequence:
          - action: light.turn_off
            target: !input light_target

      - conditions:
          - condition: trigger
            id: room_state_changed
          - condition: template
            value_template: >
              {{ trigger.to_state.state == 'On' }}
        sequence:
          - action: light.turn_on
            target: !input light_target
            data:
              brightness_pct: 100

      - conditions:
          - condition: trigger
            id: room_state_changed
          - condition: template
            value_template: >
              {{ trigger.to_state.state == 'LowLights' }}
        sequence:
          - action: light.turn_on
            target: !input light_target
            data:
              brightness_pct: !input low_brightness_value