blueprint:
  name: Room Light State Machine v2
  description: >-
    Room lighting state machine with:
      - Manual toggle events
      - Motion activation
      - Automatic dimming after inactivity
      - Lux-aware motion activation

  domain: automation

  input:
    room_state:
      name: Room State Helper
      description: Input select containing Off, On and LowLights.
      selector:
        entity:
          domain: input_select

    light_target:
      name: Light Target
      selector:
        target:
          entity:
            domain: light

    toggle_event:
      name: Toggle Event Trigger(s)
      description: >-
        Event/device triggers that should toggle the room lights.
        Example: Zigbee button press, MQTT action event, remote click.
      selector:
        triggers:
  # Manual toggle trigger(s)
  - triggers: !input toggle_event

  # Motion detected
  - trigger: state
    entity_id: !input motion_sensor
    to: "on"
    id: motion_on

  # No motion timeout
  - trigger: state
    entity_id: !input motion_sensor
    to: "off"
    for:
      seconds: !input no_motion_wait
    id: motion_off

  # State helper changed
  - trigger: state
    entity_id: !input room_state
    id: room_state_changed

condition: []

action:
  - choose:

      # Manual toggle while Off -> On
      - conditions:
          - condition: template
            value_template: >-
              {{
                trigger.id is not defined
                and states(room_state_entity) == 'Off'
              }}
        sequence:
          - service: input_select.select_option
            target:
              entity_id: !input room_state
            data:
              option: "On"

      # Manual toggle while On/LowLights -> Off
      - conditions:
          - condition: template
            value_template: >-
              {{
                trigger.id is not defined
                and states(room_state_entity) in ['On', 'LowLights']
              }}
        sequence:
          - service: input_select.select_option
            target:
              entity_id: !input room_state
            data:
              option: "Off"

      # Motion while Off -> On
      - conditions:
          - condition: trigger
            id: motion_on

          - condition: template
            value_template: >-
              {{ states(room_state_entity) == 'Off' }}

          - condition: template
            value_template: >-
              {{
                lux_limit | int(0) == 0
                or lux_sensor_entity == ''
                or states(lux_sensor_entity) | float(0) < lux_limit | float(0)
              }}
        sequence:
          - service: input_select.select_option
            target:
              entity_id: !input room_state
            data:
              option: "On"

      # No motion -> LowLights
      - conditions:
          - condition: trigger
            id: motion_off

          - condition: template
            value_template: >-
              {{ states(room_state_entity) == 'On' }}
        sequence:
          - service: input_select.select_option
            target:
              entity_id: !input room_state
            data:
              option: "LowLights"

      # Entered Off
      - conditions:
          - condition: trigger
            id: room_state_changed

          - condition: template
            value_template: >-
              {{ trigger.to_state.state == 'Off' }}
        sequence:
          - service: light.turn_off
            target: !input light_target

      # Entered On
      - conditions:
          - condition: trigger
            id: room_state_changed

          - condition: template
            value_template: >-
              {{ trigger.to_state.state == 'On' }}
        sequence:
          - service: light.turn_on
            target: !input light_target
            data:
              brightness_pct: 100

      # Entered LowLights
      - conditions:
          - condition: trigger
            id: room_state_changed

          - condition: template
            value_template: >-
              {{ trigger.to_state.state == 'LowLights' }}
        sequence:
          - service: light.turn_on
            target: !input light_target
            data:
              brightness_pct: "{{ low_brightness_value }}"