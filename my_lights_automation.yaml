blueprint:
  name: Room Light State Machine v17
  description: >-
    Advanced room lighting state machine with:
      - Automatic motion lighting
      - Manual override states
      - High lux auto-off transition from auto_on and auto_dimmed
      - Forced manual_off event trigger (room_manual_off_force)
      - Automatic dimming or Scene activation
      - Lux-aware activation & deactivation
      - Smooth light transitions
      - Event-driven architecture
      - Hardware-independent button handling
      - Schedule-based brightness or scene profiles
      - Per-state transition timings
      - A common Off Scene for uniform shutdowns
      - Configurable manual override safety timeout (Set to 0 to disable)

  domain: automation

  input:

    #########################################################
    # ROOM
    #########################################################

    room_name:
      name: Room Name
      description: >-
        Logical room identifier used for custom events.
        
        Must match the room value emitted by your
        button automations or external triggers.
      selector:
        text:

    room_state:
      name: Room State Helper
      description: >-
        Input select used internally by the state machine.

        Required options:
          - auto_off
          - auto_on
          - auto_dimmed
          - manual_off
          - manual_step2_climb
          - manual_step3
          - manual_step2_descend

        State meanings:

          auto_off:
            Room is automatically off and motion may reactivate lighting.

          auto_on:
            Room is automatically lit due to occupancy/motion.

          auto_dimmed:
            Transitional automatic dimmed state before turning off.

          manual_off:
            State 1: User manually forced lights off.
            Motion automation is overridden. Next press goes to manual_step2_climb.

          manual_step2_climb:
            State 2 (Ascending): Lights set to Stage 2 profile.
            Motion automation is overridden. Next press goes to manual_step3.

          manual_step3:
            State 3: Lights set to Stage 3 profile.
            Motion automation is overridden. Next press goes to manual_step2_descend.

          manual_step2_descend:
            State 2 (Descending): Lights set to Stage 2 profile.
            Motion automation is overridden. Next press goes to manual_off.
      selector:
        entity:
          domain: input_select

    #########################################################
    # DEVICES
    #########################################################

    light_target:
      name: Light Target (Fallback)
      description: >-
        Light or group of lights controlled by this room state machine.
        Used as a fallback if no Off Scene is defined.

        Supports:
          - single lights
          - light groups
          - areas
      selector:
        target:
          entity:
            domain: light

    motion_sensor:
      name: Motion Sensor or Group
      description: >-
        Motion or occupancy sensor controlling automatic lighting.

        Supported:
          - motion sensors
          - occupancy sensors
          - binary sensor groups

        Sensor must report:
          - on = occupied/motion
          - off = clear/no motion
      selector:
        entity:
          filter:
            - domain: binary_sensor
            - domain: group

    #########################################################
    # CONTROL MODE
    #########################################################

    control_type:
      name: Control Type
      description: Choose whether to control lights using Brightness Percentages or Scenes.
      default: brightness
      selector:
        select:
          options:
            - label: Brightness
              value: brightness
            - label: Scene
              value: scene

    #########################################################
    # TIMERS
    #########################################################

    no_motion_wait:
      name: Time Before Auto Dimmed
      description: >-
        Time without occupancy before transitioning:
          auto_on -> auto_dimmed
      default: 300
      selector:
        number:
          min: 0
          max: 3600
          unit_of_measurement: seconds
          mode: box

    auto_off_wait:
      name: Time Before Auto Off
      description: >-
        Time spent in auto_dimmed before transitioning:
          auto_dimmed -> auto_off
      default: 120
      selector:
        number:
          min: 0
          max: 3600
          unit_of_measurement: seconds
          mode: box

    manual_override_timeout:
      name: Manual Override Timeout (No Activity)
      description: >-
        Time spent without any motion before a manual override state
        automatically resets back to automatic mode (auto_off).
        Set to 0 to disable this safety timeout completely.
      default: 0
      selector:
        number:
          min: 0
          max: 1440
          unit_of_measurement: minutes
          mode: box

    #########################################################
    # LUX & HIGH LUX CUT-OFF
    #########################################################

    lux_sensor:
      name: Activation Lux Sensor
      description: >-
        Optional brightness sensor used to prevent lights from
        automatically turning on when the room is already bright.

        Leave empty to disable lux-based activation logic.
      default: ""
      selector:
        entity:
          domain: sensor

    lux_limit:
      name: Activation Lux Limit
      description: >-
        Maximum lux value allowed for automatic activation.
      default: 0
      selector:
        number:
          min: 0
          max: 10000

    high_lux_sensor:
      name: High Lux Cut-Off Sensor
      description: >-
        Lux sensor used to turn lights OFF if ambient light becomes bright enough while in auto_on or auto_dimmed state.
        Leave empty to disable high lux auto-off.
      default: ""
      selector:
        entity:
          domain: sensor

    high_lux_limit:
      name: High Lux Limit (Off Cut-off)
      description: >-
        If lux goes above this limit for the delay duration, lights will transition to auto_off.
      default: 0
      selector:
        number:
          min: 0
          max: 10000

    high_lux_wait:
      name: High Lux Delay (Seconds)
      description: >-
        Time lux must continuously stay above the high lux threshold before triggering auto_off.
      default: 30
      selector:
        number:
          min: 0
          max: 3600
          unit_of_measurement: seconds
          mode: box

    #########################################################
    # BRIGHTNESS SETTINGS (Used if Control Type is Brightness)
    #########################################################

    auto_on_brightness:
      name: Daylight Auto On Brightness %
      description: Brightness level used during auto_on state when the daylight schedule is ON.
      default: 100
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"

    auto_dimmed_brightness:
      name: Daylight Auto Dimmed Brightness %
      description: Brightness level used during auto_dimmed state when the daylight schedule is ON.
      default: 20
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"

    timed_auto_on_brightness:
      name: Nightlight Auto On Brightness %
      description: Brightness level used during auto_on state when the daylight schedule is OFF.
      default: 30
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"

    timed_auto_dimmed_brightness:
      name: Nightlight Auto Dimmed Brightness %
      description: Brightness level used during auto_dimmed state when the daylight schedule is OFF.
      default: 5
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"

    #########################################################
    # SCENE SETTINGS (Used if Control Type is Scene)
    #########################################################

    daylight_bright_scene:
      name: Daylight Bright Scene
      description: Scene activated for normal daytime occupancy when the daylight schedule is ON.
      default: ""
      selector:
        entity:
          domain: scene

    daylight_dim_scene:
      name: Daylight Dim Scene
      description: Scene activated during daytime pre-off warning period when the daylight schedule is ON.
      default: ""
      selector:
        entity:
          domain: scene

    nightlight_bright_scene:
      name: Nightlight Bright Scene
      description: Scene activated for night-time occupancy when the daylight schedule is OFF.
      default: ""
      selector:
        entity:
          domain: scene

    nightlight_dim_scene:
      name: Nightlight Dim Scene
      description: Scene activated during night-time pre-off warning period when the daylight schedule is OFF.
      default: ""
      selector:
        entity:
          domain: scene

    off_scene:
      name: Off Scene (Optional)
      description: Common scene activated to turn everything off. Leave blank to use standard light turn off.
      default: ""
      selector:
        entity:
          domain: scene

    #########################################################
    # MANUAL MODE SETTINGS (Dedicated Override Inputs)
    #########################################################

    manual_brightness_stage_2:
      name: Manual Stage 2 Brightness %
      description: Brightness level used for manual_step2_climb and manual_step2_descend states when Control Type is Brightness.
      default: 40
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"

    manual_brightness_stage_3:
      name: Manual Stage 3 Brightness %
      description: Brightness level used for manual_step3 state when Control Type is Brightness.
      default: 100
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"

    manual_scene_stage_2:
      name: Manual Stage 2 Scene
      description: Scene activated for manual_step2_climb and manual_step2_descend states when Control Type is Scene.
      default: ""
      selector:
        entity:
          domain: scene

    manual_scene_stage_3:
      name: Manual Stage 3 Scene
      description: Scene activated for manual_step3 state when Control Type is Scene.
      default: ""
      selector:
        entity:
          domain: scene

    #########################################################
    # TIMED PROFILES CONFIGURATION (via Schedule Helper)
    #########################################################

    timed_brightness_enabled:
      name: Enable Daylight/Nightlight Schedule
      description: Enable alternating between Daylight and Nightlight profiles based on a schedule helper.
      default: false
      selector:
        boolean:

    profile_schedule:
      name: Daylight Schedule
      description: Select the Schedule Helper entity that defines when it is Daytime (Schedule ON = Daylight, Schedule OFF = Nightlight).
      default: ""
      selector:
        entity:
          domain: schedule

    #########################################################
    # TRANSITIONS
    #########################################################

    transition_auto_on:
      name: Transition Auto Off -> Auto On
      default: 1
      selector:
        number:
          min: 0
          max: 30
          step: 0.1
          unit_of_measurement: seconds
          mode: box

    transition_auto_dimmed:
      name: Transition Auto On -> Auto Dimmed
      default: 5
      selector:
        number:
          min: 0
          max: 30
          step: 0.1
          unit_of_measurement: seconds
          mode: box

    transition_auto_off:
      name: Transition Auto Dimmed -> Auto Off
      default: 3
      selector:
        number:
          min: 0
          max: 30
          step: 0.1
          unit_of_measurement: seconds
          mode: box

    transition_manual:
      name: Manual On/Off Transition
      default: 0.5
      selector:
        number:
          min: 0
          max: 30
          step: 0.1
          unit_of_measurement: seconds
          mode: box

mode: restart

variables:
  room_name_value: !input room_name
  room_state_entity: !input room_state

  lux_sensor_entity: !input lux_sensor
  lux_limit_value: !input lux_limit

  high_lux_sensor_entity: !input high_lux_sensor
  high_lux_limit_value: !input high_lux_limit

  control_type_value: !input control_type

  timed_brightness_enabled_value: !input timed_brightness_enabled
  schedule_entity: !input profile_schedule

  # Brightness inputs Mapping
  auto_on_brightness_input: !input auto_on_brightness
  auto_dimmed_brightness_input: !input auto_dimmed_brightness
  timed_auto_on_brightness_input: !input timed_auto_on_brightness
  timed_auto_dimmed_brightness_input: !input timed_auto_dimmed_brightness

  # Scene inputs Mapping
  daylight_bright: !input daylight_bright_scene
  daylight_dim: !input daylight_dim_scene
  nightlight_bright: !input nightlight_bright_scene
  nightlight_dim: !input nightlight_dim_scene
  off_scene_value: !input off_scene

  # Manual override Inputs Mapping
  manual_bright_2: !input manual_brightness_stage_2
  manual_bright_3: !input manual_brightness_stage_3
  manual_sc_2: !input manual_scene_stage_2
  manual_sc_3: !input manual_scene_stage_3

  # Safety Timeout Value
  manual_timeout_val: !input manual_override_timeout

  #########################################################
  # SCHEDULE STATE DETECTION
  #########################################################

  is_daylight: >
    {% if not timed_brightness_enabled_value or schedule_entity in ['', 'none', none] %}
      true
    {% else %}
      {{ states(schedule_entity) == 'on' }}
    {% endif %}

  #########################################################
  # EFFECTIVE LIGHT OUTPUT VALUES
  #########################################################

  auto_on_brightness_value: >
    {% if is_daylight | trim | bool %}
      {{ auto_on_brightness_input }}
    {% else %}
      {{ timed_auto_on_brightness_input }}
    {% endif %}

  auto_dimmed_brightness_value: >
    {% if is_daylight | trim | bool %}
      {{ auto_dimmed_brightness_input }}
    {% else %}
      {{ timed_auto_dimmed_brightness_input }}
    {% endif %}

  effective_bright_scene: >
    {% if is_daylight | trim | bool %}
      {{ daylight_bright }}
    {% else %}
      {{ nightlight_bright }}
    {% endif %}

  effective_dim_scene: >
    {% if is_daylight | trim | bool %}
      {{ daylight_dim }}
    {% else %}
      {{ nightlight_dim }}
    {% endif %}

trigger:

  #########################################################
  # MOTION
  #########################################################

  - platform: state
    entity_id: !input motion_sensor
    to: "on"
    id: motion_on

  - platform: state
    entity_id: !input motion_sensor
    to: "off"
    for:
      seconds: !input no_motion_wait
    id: motion_off

  #########################################################
  # HIGH LUX CUT-OFF TRIGGER
  #########################################################

  - platform: numeric_state
    entity_id: !input high_lux_sensor
    above: !input high_lux_limit
    for:
      seconds: !input high_lux_wait
    id: high_lux_cutoff

  #########################################################
  # AUTO DIMMED TIMEOUT
  #########################################################

  - platform: state
    entity_id: !input room_state
    to: "auto_dimmed"
    for:
      seconds: !input auto_off_wait
    id: auto_dimmed_timeout

  #########################################################
  # ROOM STATE CHANGED
  #########################################################

  - platform: state
    entity_id: !input room_state
    id: room_state_changed

  #########################################################
  # MANUAL TOGGLE EVENT
  #########################################################

  - platform: event
    event_type: room_manual_toggle
    event_data:
      room: !input room_name
    id: manual_toggle

  #########################################################
  # FORCE MANUAL OFF EVENT
  #########################################################

  - platform: event
    event_type: room_manual_off_force
    event_data:
      room: !input room_name
    id: manual_off_force

  #########################################################
  # AUTO MODE ENABLE EVENT
  #########################################################

  - platform: event
    event_type: room_auto_mode_enable
    event_data:
      room: !input room_name
    id: auto_mode_enable

  #########################################################
  # MANUAL OVERRIDE INACTIVITY TIMEOUTS
  #########################################################

  # Track if motion stays clear while already in a manual override
  - platform: state
    entity_id: !input motion_sensor
    to: "off"
    for:
      minutes: !input manual_override_timeout
    id: manual_activity_timeout

  # Track if a manual override is initiated while the room is already empty
  - platform: state
    entity_id: !input room_state
    to:
      - "manual_off"
      - "manual_step2_climb"
      - "manual_step3"
      - "manual_step2_descend"
    for:
      minutes: !input manual_override_timeout
    id: manual_activity_timeout

condition: []

action:
  - choose:

      #########################################################
      # HIGH LUX CUT-OFF
      #########################################################

      - conditions:
          - condition: trigger
            id: high_lux_cutoff
          - condition: template
            value_template: "{{ high_lux_limit_value | int(0) > 0 }}"
          - condition: template
            value_template: "{{ high_lux_sensor_entity not in ['', 'none', none] }}"
          - condition: template
            value_template: "{{ states(room_state_entity) in ['auto_on', 'auto_dimmed'] }}"
        sequence:
          - action: input_select.select_option
            target:
              entity_id: !input room_state
            data:
              option: "auto_off"

      #########################################################
      # FORCE MANUAL OFF TRIGGER
      #########################################################

      - conditions:
          - condition: trigger
            id: manual_off_force
        sequence:
          - action: input_select.select_option
            target:
              entity_id: !input room_state
            data:
              option: "manual_off"

      #########################################################
      # RETURN TO AUTO MODE
      #########################################################

      - conditions:
          - condition: trigger
            id: auto_mode_enable
        sequence:
          - choose:
              # Occupied -> auto_on
              - conditions:
                  - condition: state
                    entity_id: !input motion_sensor
                    state: "on"
                sequence:
                  - action: input_select.select_option
                    target:
                      entity_id: !input room_state
                    data:
                      option: "auto_on"
            default:
              # Not occupied -> auto_off
              - action: input_select.select_option
                target:
                  entity_id: !input room_state
                data:
                  option: "auto_off"

      #########################################################
      # MANUAL OVERRIDE INACTIVITY RESET
      #########################################################

      - conditions:
          - condition: trigger
            id: manual_activity_timeout
          - condition: template
            value_template: "{{ manual_timeout_val | int(0) > 0 }}"
          - condition: template
            value_template: "{{ states(room_state_entity) in ['manual_off', 'manual_step2_climb', 'manual_step3', 'manual_step2_descend'] }}"
          - condition: state
            entity_id: !input motion_sensor
            state: "off"
        sequence:
          - action: input_select.select_option
            target:
              entity_id: !input room_state
            data:
              option: "auto_off"

      #########################################################
      # MANUAL TRANSITIONS (3-STATE SEQUENTIAL CYCLE)
      #########################################################

      # auto_on (Bright) -> manual_off
      - conditions:
          - condition: trigger
            id: manual_toggle
          - condition: template
            value_template: "{{ states(room_state_entity) == 'auto_on' }}"
        sequence:
          - action: input_select.select_option
            target:
              entity_id: !input room_state
            data:
              option: "manual_off"

      # auto_off (Off) -> manual_step3
      - conditions:
          - condition: trigger
            id: manual_toggle
          - condition: template
            value_template: "{{ states(room_state_entity) == 'auto_off' }}"
        sequence:
          - action: input_select.select_option
            target:
              entity_id: !input room_state
            data:
              option: "manual_step3"

      # auto_dimmed (Dim) -> manual_off
      - conditions:
          - condition: trigger
            id: manual_toggle
          - condition: template
            value_template: "{{ states(room_state_entity) == 'auto_dimmed' }}"
        sequence:
          - action: input_select.select_option
            target:
              entity_id: !input room_state
            data:
              option: "manual_off"

      # manual_off (State 1) -> manual_step2_climb (State 2 Ascending)
      - conditions:
          - condition: trigger
            id: manual_toggle
          - condition: template
            value_template: "{{ states(room_state_entity) == 'manual_off' }}"
        sequence:
          - action: input_select.select_option
            target:
              entity_id: !input room_state
            data:
              option: "manual_step2_climb"

      # manual_step2_climb (State 2 Ascending) -> manual_step3 (State 3)
      - conditions:
          - condition: trigger
            id: manual_toggle
          - condition: template
            value_template: "{{ states(room_state_entity) == 'manual_step2_climb' }}"
        sequence:
          - action: input_select.select_option
            target:
              entity_id: !input room_state
            data:
              option: "manual_step3"

      # manual_step3 (State 3) -> manual_step2_descend (State 2 Descending)
      - conditions:
          - condition: trigger
            id: manual_toggle
          - condition: template
            value_template: "{{ states(room_state_entity) == 'manual_step3' }}"
        sequence:
          - action: input_select.select_option
            target:
              entity_id: !input room_state
            data:
              option: "manual_step2_descend"

      # manual_step2_descend (State 2 Descending) -> manual_off (State 1)
      - conditions:
          - condition: trigger
            id: manual_toggle
          - condition: template
            value_template: "{{ states(room_state_entity) == 'manual_step2_descend' }}"
        sequence:
          - action: input_select.select_option
            target:
              entity_id: !input room_state
            data:
              option: "manual_off"

      #########################################################
      # AUTO MOTION LOGIC
      #########################################################

      # Motion while auto_off -> auto_on
      - conditions:
          - condition: trigger
            id: motion_on
          - condition: template
            value_template: "{{ states(room_state_entity) == 'auto_off' }}"
          - condition: template
            value_template: >
              {{
                lux_limit_value | int(0) == 0
                or lux_sensor_entity in ['', 'none', none]
                or states(lux_sensor_entity) | float(0) < lux_limit_value | float(0)
              }}
        sequence:
          - action: input_select.select_option
            target:
              entity_id: !input room_state
            data:
              option: "auto_on"

      # Motion while auto_dimmed -> auto_on
      - conditions:
          - condition: trigger
            id: motion_on
          - condition: template
            value_template: "{{ states(room_state_entity) == 'auto_dimmed' }}"
        sequence:
          - action: input_select.select_option
            target:
              entity_id: !input room_state
            data:
              option: "auto_on"

      # No motion while auto_on -> auto_dimmed
      - conditions:
          - condition: trigger
            id: motion_off
          - condition: template
            value_template: "{{ states(room_state_entity) == 'auto_on' }}"
        sequence:
          - action: input_select.select_option
            target:
              entity_id: !input room_state
            data:
              option: "auto_dimmed"

      # auto_dimmed timeout -> auto_off
      - conditions:
          - condition: trigger
            id: auto_dimmed_timeout
        sequence:
          - action: input_select.select_option
            target:
              entity_id: !input room_state
            data:
              option: "auto_off"

      #########################################################
      # LIGHT OUTPUTS
      #########################################################

      # auto_off
      - conditions:
          - condition: trigger
            id: room_state_changed
          - condition: template
            value_template: "{{ trigger.to_state.state == 'auto_off' }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ control_type_value == 'scene' and off_scene_value != '' }}"
                sequence:
                  - action: scene.turn_on
                    target:
                      entity_id: "{{ off_scene_value }}"
                    data:
                      transition: !input transition_auto_off
            default:
              - action: light.turn_off
                target: !input light_target
                data:
                  transition: !input transition_auto_off

      # manual_off (State 1 - Off)
      - conditions:
          - condition: trigger
            id: room_state_changed
          - condition: template
            value_template: "{{ trigger.to_state.state == 'manual_off' }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ control_type_value == 'scene' and off_scene_value != '' }}"
                sequence:
                  - action: scene.turn_on
                    target:
                      entity_id: "{{ off_scene_value }}"
                    data:
                      transition: !input transition_manual
            default:
              - action: light.turn_off
                target: !input light_target
                data:
                  transition: !input transition_manual

      # auto_on
      - conditions:
          - condition: trigger
            id: room_state_changed
          - condition: template
            value_template: "{{ trigger.to_state.state == 'auto_on' }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ control_type_value == 'scene' and effective_bright_scene != '' }}"
                sequence:
                  - action: scene.turn_on
                    target:
                      entity_id: "{{ effective_bright_scene }}"
                    data:
                      transition: !input transition_auto_on
            default:
              - action: light.turn_on
                target: !input light_target
                data:
                  brightness_pct: "{{ auto_on_brightness_value | int }}"
                  transition: !input transition_auto_on

      # manual_step3 (State 3 - Bright Override)
      - conditions:
          - condition: trigger
            id: room_state_changed
          - condition: template
            value_template: "{{ trigger.to_state.state == 'manual_step3' }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ control_type_value == 'scene' and manual_sc_3 != '' }}"
                sequence:
                  - action: scene.turn_on
                    target:
                      entity_id: "{{ manual_sc_3 }}"
                    data:
                      transition: !input transition_manual
            default:
              - action: light.turn_on
                target: !input light_target
                data:
                  brightness_pct: "{{ manual_bright_3 | int }}"
                  transition: !input transition_manual

      # auto_dimmed
      - conditions:
          - condition: trigger
            id: room_state_changed
          - condition: template
            value_template: "{{ trigger.to_state.state == 'auto_dimmed' }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ control_type_value == 'scene' and effective_dim_scene != '' }}"
                sequence:
                  - action: scene.turn_on
                    target:
                      entity_id: "{{ effective_dim_scene }}"
                    data:
                      transition: !input transition_auto_dimmed
            default:
              - action: light.turn_on
                target: !input light_target
                data:
                  brightness_pct: "{{ auto_dimmed_brightness_value | int }}"
                  transition: !input transition_auto_dimmed

      # manual_step2_climb & manual_step2_descend (State 2 - Override)
      - conditions:
          - condition: trigger
            id: room_state_changed
          - condition: template
            value_template: "{{ trigger.to_state.state in ['manual_step2_climb', 'manual_step2_descend'] }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ control_type_value == 'scene' and manual_sc_2 != '' }}"
                sequence:
                  - action: scene.turn_on
                    target:
                      entity_id: "{{ manual_sc_2 }}"
                    data:
                      transition: !input transition_manual
            default:
              - action: light.turn_on
                target: !input light_target
                data:
                  brightness_pct: "{{ manual_bright_2 | int }}"
                  transition: !input transition_manual