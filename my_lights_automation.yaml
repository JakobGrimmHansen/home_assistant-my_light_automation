blueprint:
  name: Room Light State Machine v7
  description: >-
    Advanced room lighting state machine with:
      - Automatic motion lighting
      - Manual override states
      - Automatic dimming
      - Lux-aware activation
      - Smooth light transitions
      - Event-driven architecture
      - Hardware-independent button handling
      - Time-based brightness profiles

  domain: automation

  input:

    room_name:
      name: Room Name
      description: >-
        Logical room identifier used for custom events.
        
        Must match the room value emitted by your
        button automations.

      selector:
        text:

    room_state:
      name: Room State Helper
      description: >-
        Input select used internally by the state machine.

        Required options:
          - auto_off
          - auto_on
          - auto_dimmed
          - manual_on
          - manual_off

        State meanings:

          auto_off:
            Room is automatically off and motion may reactivate lighting.

          auto_on:
            Room is automatically lit due to occupancy/motion.

          auto_dimmed:
            Transitional automatic dimmed state before turning off.

          manual_on:
            User manually forced lights on.
            Motion automation will not turn lights off.

          manual_off:
            User manually forced lights off.
            Motion automation will not turn lights on.

      selector:
        entity:
          domain: input_select

    light_target:
      name: Light Target
      description: >-
        Light or group of lights controlled by this room state machine.

        Supports:
          - single lights
          - light groups
          - areas

      selector:
        target:
          entity:
            domain: light

    motion_sensor:
      name: Motion Sensor or Group
      description: >-
        Motion or occupancy sensor controlling automatic lighting.

        Supported:
          - motion sensors
          - occupancy sensors
          - binary sensor groups

        Sensor must report:
          - on = occupied/motion
          - off = clear/no motion

      selector:
        entity:
          filter:
            - domain: binary_sensor
            - domain: group

    no_motion_wait:
      name: Time Before Auto Dimmed
      description: >-
        Time without occupancy before transitioning:
          auto_on -> auto_dimmed

      default: 300

      selector:
        number:
          min: 0
          max: 3600
          unit_of_measurement: seconds
          mode: box

    auto_off_wait:
      name: Time Before Auto Off
      description: >-
        Time spent in auto_dimmed before transitioning:
          auto_dimmed -> auto_off

      default: 120

      selector:
        number:
          min: 0
          max: 3600
          unit_of_measurement: seconds
          mode: box

    lux_sensor:
      name: Lux Sensor
      description: >-
        Optional brightness sensor used to prevent lights from
        automatically turning on when the room is already bright.

        Leave empty to disable lux-based activation logic.

      default: ""

      selector:
        entity:
          domain: sensor

    lux_limit:
      name: Lux Limit
      description: >-
        Maximum lux value allowed for automatic activation.

      default: 0

      selector:
        number:
          min: 0
          max: 10000

    #########################################################
    # BRIGHTNESS SETTINGS
    #########################################################

    auto_on_brightness:
      name: Auto On Brightness %
      description: >-
        Default brightness level used during auto_on state.

      default: 100

      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"

    auto_dimmed_brightness:
      name: Auto Dimmed Brightness %
      description: >-
        Brightness level used during auto_dimmed state.

      default: 20

      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"

    #########################################################
    # TIME-BASED BRIGHTNESS
    #########################################################

    timed_brightness_enabled:
      name: Timed Brightness Enabled
      description: >-
        Enable alternate brightness levels during a fixed time window.

      default: false

      selector:
        boolean:

    timed_brightness_start:
      name: Timed Brightness Start
      description: Start time for alternate brightness mode.

      default: "22:00:00"

      selector:
        time:

    timed_brightness_end:
      name: Timed Brightness End
      description: End time for alternate brightness mode.

      default: "06:00:00"

      selector:
        time:

    timed_auto_on_brightness:
      name: Timed Auto On Brightness %
      description: >-
        Auto_on brightness used during timed mode.

      default: 30

      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"

    timed_auto_dimmed_brightness:
      name: Timed Auto Dimmed Brightness %
      description: >-
        Auto_dimmed brightness used during timed mode.

      default: 5

      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"

    #########################################################
    # TRANSITION
    #########################################################

    transition_time:
      name: Light Transition Time
      description: >-
        Fade duration used for all brightness and on/off transitions.

      default: 1

      selector:
        number:
          min: 0
          max: 30
          step: 0.1
          unit_of_measurement: seconds
          mode: box

mode: restart

variables:
  room_name_value: !input room_name
  room_state_entity: !input room_state

  lux_sensor_entity: !input lux_sensor
  lux_limit_value: !input lux_limit

  timed_brightness_enabled_value: !input timed_brightness_enabled
  timed_brightness_start_value: !input timed_brightness_start
  timed_brightness_end_value: !input timed_brightness_end

  #########################################################
  # TIME WINDOW DETECTION
  #########################################################

  is_timed_brightness: >
    {% set start = timed_brightness_start_value %}
    {% set end = timed_brightness_end_value %}
    {% set now_time = now().strftime('%H:%M:%S') %}

    {% if not timed_brightness_enabled_value %}
      false
    {% elif start < end %}
      {{ start <= now_time < end }}
    {% else %}
      {{ now_time >= start or now_time < end }}
    {% endif %}

  #########################################################
  # EFFECTIVE BRIGHTNESS VALUES
  #########################################################

  auto_on_brightness_value: >
    {% if is_timed_brightness %}
      {{ !input timed_auto_on_brightness }}
    {% else %}
      {{ !input auto_on_brightness }}
    {% endif %}

  auto_dimmed_brightness_value: >
    {% if is_timed_brightness %}
      {{ !input timed_auto_dimmed_brightness }}
    {% else %}
      {{ !input auto_dimmed_brightness }}
    {% endif %}

trigger:

  #########################################################
  # MOTION
  #########################################################

  - platform: state
    entity_id: !input motion_sensor
    to: "on"
    id: motion_on

  - platform: state
    entity_id: !input motion_sensor
    to: "off"
    for:
      seconds: !input no_motion_wait
    id: motion_off

  #########################################################
  # AUTO DIMMED TIMEOUT
  #########################################################

  - platform: state
    entity_id: !input room_state
    to: "auto_dimmed"
    for:
      seconds: !input auto_off_wait
    id: auto_dimmed_timeout

  #########################################################
  # ROOM STATE CHANGED
  #########################################################

  - platform: state
    entity_id: !input room_state
    id: room_state_changed

  #########################################################
  # MANUAL TOGGLE EVENT
  #########################################################

  - platform: event
    event_type: room_manual_toggle
    event_data:
      room: !input room_name
    id: manual_toggle

  #########################################################
  # RETURN TO AUTO MODE EVENT
  #########################################################

  - platform: event
    event_type: room_auto_mode
    event_data:
      room: !input room_name
    id: auto_mode

condition: []

action:
  - choose:

      #########################################################
      # RETURN TO AUTO MODE
      #########################################################

      - conditions:
          - condition: trigger
            id: auto_mode

        sequence:
          - choose:

              # Occupied -> auto_on
              - conditions:
                  - condition: state
                    entity_id: !input motion_sensor
                    state: "on"

                sequence:
                  - service: input_select.select_option
                    target:
                      entity_id: !input room_state
                    data:
                      option: "auto_on"

            default:
              # Not occupied -> auto_off
              - service: input_select.select_option
                target:
                  entity_id: !input room_state
                data:
                  option: "auto_off"

      #########################################################
      # MANUAL TRANSITIONS
      #########################################################

      # auto_on -> manual_off
      - conditions:
          - condition: trigger
            id: manual_toggle

          - condition: template
            value_template: >
              {{ states(room_state_entity) == 'auto_on' }}

        sequence:
          - service: input_select.select_option
            target:
              entity_id: !input room_state
            data:
              option: "manual_off"

      # auto_off -> manual_on
      - conditions:
          - condition: trigger
            id: manual_toggle

          - condition: template
            value_template: >
              {{ states(room_state_entity) == 'auto_off' }}

        sequence:
          - service: input_select.select_option
            target:
              entity_id: !input room_state
            data:
              option: "manual_on"

      # auto_dimmed -> manual_off
      - conditions:
          - condition: trigger
            id: manual_toggle

          - condition: template
            value_template: >
              {{ states(room_state_entity) == 'auto_dimmed' }}

        sequence:
          - service: input_select.select_option
            target:
              entity_id: !input room_state
            data:
              option: "manual_off"

      # manual_off -> manual_on
      - conditions:
          - condition: trigger
            id: manual_toggle

          - condition: template
            value_template: >
              {{ states(room_state_entity) == 'manual_off' }}

        sequence:
          - service: input_select.select_option
            target:
              entity_id: !input room_state
            data:
              option: "manual_on"

      # manual_on -> manual_off
      - conditions:
          - condition: trigger
            id: manual_toggle

          - condition: template
            value_template: >
              {{ states(room_state_entity) == 'manual_on' }}

        sequence:
          - service: input_select.select_option
            target:
              entity_id: !input room_state
            data:
              option: "manual_off"

      #########################################################
      # AUTO MOTION LOGIC
      #########################################################

      # Motion while auto_off -> auto_on
      - conditions:
          - condition: trigger
            id: motion_on

          - condition: template
            value_template: >
              {{ states(room_state_entity) == 'auto_off' }}

          - condition: template
            value_template: >
              {{
                lux_limit_value | int(0) == 0
                or lux_sensor_entity == ''
                or states(lux_sensor_entity) | float(0) < lux_limit_value | float(0)
              }}

        sequence:
          - service: input_select.select_option
            target:
              entity_id: !input room_state
            data:
              option: "auto_on"

      # Motion while auto_dimmed -> auto_on
      - conditions:
          - condition: trigger
            id: motion_on

          - condition: template
            value_template: >
              {{ states(room_state_entity) == 'auto_dimmed' }}

        sequence:
          - service: input_select.select_option
            target:
              entity_id: !input room_state
            data:
              option: "auto_on"

      # No motion while auto_on -> auto_dimmed
      - conditions:
          - condition: trigger
            id: motion_off

          - condition: template
            value_template: >
              {{ states(room_state_entity) == 'auto_on' }}

        sequence:
          - service: input_select.select_option
            target:
              entity_id: !input room_state
            data:
              option: "auto_dimmed"

      # auto_dimmed timeout -> auto_off
      - conditions:
          - condition: trigger
            id: auto_dimmed_timeout

        sequence:
          - service: input_select.select_option
            target:
              entity_id: !input room_state
            data:
              option: "auto_off"

      #########################################################
      # LIGHT OUTPUTS
      #########################################################

      # auto_off
      - conditions:
          - condition: trigger
            id: room_state_changed

          - condition: template
            value_template: >
              {{ trigger.to_state.state == 'auto_off' }}

        sequence:
          - service: light.turn_off
            target: !input light_target
            data:
              transition: !input transition_time

      # manual_off
      - conditions:
          - condition: trigger
            id: room_state_changed

          - condition: template
            value_template: >
              {{ trigger.to_state.state == 'manual_off' }}

        sequence:
          - service: light.turn_off
            target: !input light_target
            data:
              transition: !input transition_time

      # auto_on
      - conditions:
          - condition: trigger
            id: room_state_changed

          - condition: template
            value_template: >
              {{ trigger.to_state.state == 'auto_on' }}

        sequence:
          - service: light.turn_on
            target: !input light_target
            data:
              brightness_pct: "{{ auto_on_brightness_value | int }}"
              transition: !input transition_time

      # manual_on
      - conditions:
          - condition: trigger
            id: room_state_changed

          - condition: template
            value_template: >
              {{ trigger.to_state.state == 'manual_on' }}

        sequence:
          - service: light.turn_on
            target: !input light_target
            data:
              brightness_pct: 100
              transition: !input transition_time

      # auto_dimmed
      - conditions:
          - condition: trigger
            id: room_state_changed

          - condition: template
            value_template: >
              {{ trigger.to_state.state == 'auto_dimmed' }}

        sequence:
          - service: light.turn_on
            target: !input light_target
            data:
              brightness_pct: "{{ auto_dimmed_brightness_value | int }}"
              transition: !input transition_time