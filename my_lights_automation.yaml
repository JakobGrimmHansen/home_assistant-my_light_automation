blueprint:
  name: Room Light State Machine v6
  description: >-
    Advanced room lighting state machine with:
      - Automatic motion lighting
      - Manual override states
      - Automatic dimming
      - Lux-aware activation
      - Smooth light transitions
      - Event-driven architecture
      - Hardware-independent button handling

  domain: automation

  input:

    room_name:
      name: Room Name
      description: >-
        Logical room identifier used for custom events.

        Example:
          living_room
          bedroom
          office

        Must match the room value emitted by your
        button automations.

      selector:
        text:

    room_state:
      name: Room State Helper
      description: >-
        Input select used internally by the state machine.

        Required options:
          - auto_off
          - auto_on
          - auto_dimmed
          - manual_on
          - manual_off

        State meanings:

          auto_off:
            Room is automatically off and motion may reactivate lighting.

          auto_on:
            Room is automatically lit due to occupancy/motion.

          auto_dimmed:
            Transitional automatic dimmed state before turning off.

          manual_on:
            User manually forced lights on.
            Motion automation will not turn lights off.

          manual_off:
            User manually forced lights off.
            Motion automation will not turn lights on.

      selector:
        entity:
          domain: input_select

    light_target:
      name: Light Target
      description: >-
        Light or group of lights controlled by this room state machine.

        Supports:
          - single lights
          - light groups
          - areas

      selector:
        target:
          entity:
            domain: light

    motion_sensor:
      name: Motion Sensor or Group
      description: >-
        Motion or occupancy sensor controlling automatic lighting.

        Supported:
          - motion sensors
          - occupancy sensors
          - binary sensor groups

        Sensor must report:
          - on = occupied/motion
          - off = clear/no motion

      selector:
        entity:
          filter:
            - domain: binary_sensor
            - domain: group

    no_motion_wait:
      name: Time Before Auto Dimmed
      description: >-
        Time without occupancy before transitioning:

          auto_on -> auto_dimmed

        Example:
          300 seconds = 5 minutes

      default: 300

      selector:
        number:
          min: 0
          max: 3600
          unit_of_measurement: seconds
          mode: box

    auto_off_wait:
      name: Time Before Auto Off
      description: >-
        Time spent in auto_dimmed before transitioning:

          auto_dimmed -> auto_off

        Example:
          120 seconds = 2 minutes

      default: 120

      selector:
        number:
          min: 0
          max: 3600
          unit_of_measurement: seconds
          mode: box

    lux_sensor:
      name: Lux Sensor
      description: >-
        Optional brightness sensor used to prevent lights from
        automatically turning on when the room is already bright.

        Leave empty to disable lux-based activation logic.

      default: ""

      selector:
        entity:
          domain: sensor

    lux_limit:
      name: Lux Limit
      description: >-
        Maximum lux value allowed for automatic activation.

        If current lux is ABOVE this value:
          motion will NOT turn lights on.

        Set to:
          0 = disable lux checking entirely

      default: 0

      selector:
        number:
          min: 0
          max: 10000

    auto_dimmed_brightness:
      name: Auto Dimmed Brightness %
      description: >-
        Brightness level used during the auto_dimmed state.

        Example:
          20 = softly dimmed transitional lighting

      default: 20

      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"

    transition_time:
      name: Light Transition Time
      description: >-
        Fade duration used for all brightness and on/off transitions.

        Examples:
          0 = instant changes
          1 = quick smooth fade
          5 = slow cinematic fade

      default: 1

      selector:
        number:
          min: 0
          max: 30
          step: 0.1
          unit_of_measurement: seconds
          mode: box

mode: restart

variables:
  room_name_value: !input room_name
  room_state_entity: !input room_state
  lux_sensor_entity: !input lux_sensor
  lux_limit_value: !input lux_limit

trigger:

  #########################################################
  # MOTION
  #########################################################

  - platform: state
    entity_id: !input motion_sensor
    to: "on"
    id: motion_on

  - platform: state
    entity_id: !input motion_sensor
    to: "off"
    for:
      seconds: !input no_motion_wait
    id: motion_off

  #########################################################
  # AUTO DIMMED TIMEOUT
  #########################################################

  - platform: state
    entity_id: !input room_state
    to: "auto_dimmed"
    for:
      seconds: !input auto_off_wait
    id: auto_dimmed_timeout

  #########################################################
  # ROOM STATE CHANGED
  #########################################################

  - platform: state
    entity_id: !input room_state
    id: room_state_changed

  #########################################################
  # MANUAL TOGGLE EVENT
  #########################################################

  - platform: event
    event_type: room_manual_toggle
    event_data:
      room: !input room_name
    id: manual_toggle

  #########################################################
  # RETURN TO AUTO MODE EVENT
  #########################################################

  - platform: event
    event_type: room_auto_mode
    event_data:
      room: !input room_name
    id: auto_mode

condition: []

action:
  - choose:

      #########################################################
      # RETURN TO AUTO MODE
      #########################################################

      - conditions:
          - condition: trigger
            id: auto_mode

        sequence:
          - choose:

              # Occupied -> auto_on
              - conditions:
                  - condition: state
                    entity_id: !input motion_sensor
                    state: "on"

                sequence:
                  - service: input_select.select_option
                    target:
                      entity_id: !input room_state
                    data:
                      option: "auto_on"

            default:
              # Not occupied -> auto_off
              - service: input_select.select_option
                target:
                  entity_id: !input room_state
                data:
                  option: "auto_off"

      #########################################################
      # MANUAL TRANSITIONS
      #########################################################

      # auto_on -> manual_off
      - conditions:
          - condition: trigger
            id: manual_toggle

          - condition: template
            value_template: >
              {{ states(room_state_entity) == 'auto_on' }}

        sequence:
          - service: input_select.select_option
            target:
              entity_id: !input room_state
            data:
              option: "manual_off"

      # auto_off -> manual_on
      - conditions:
          - condition: trigger
            id: manual_toggle

          - condition: template
            value_template: >
              {{ states(room_state_entity) == 'auto_off' }}

        sequence:
          - service: input_select.select_option
            target:
              entity_id: !input room_state
            data:
              option: "manual_on"

      # auto_dimmed -> manual_off
      - conditions:
          - condition: trigger
            id: manual_toggle

          - condition: template
            value_template: >
              {{ states(room_state_entity) == 'auto_dimmed' }}

        sequence:
          - service: input_select.select_option
            target:
              entity_id: !input room_state
            data:
              option: "manual_off"

      # manual_off -> manual_on
      - conditions:
          - condition: trigger
            id: manual_toggle

          - condition: template
            value_template: >
              {{ states(room_state_entity) == 'manual_off' }}

        sequence:
          - service: input_select.select_option
            target:
              entity_id: !input room_state
            data:
              option: "manual_on"

      # manual_on -> manual_off
      - conditions:
          - condition: trigger
            id: manual_toggle

          - condition: template
            value_template: >
              {{ states(room_state_entity) == 'manual_on' }}

        sequence:
          - service: input_select.select_option
            target:
              entity_id: !input room_state
            data:
              option: "manual_off"

      #########################################################
      # AUTO MOTION LOGIC
      #########################################################

      # Motion while auto_off -> auto_on
      - conditions:
          - condition: trigger
            id: motion_on

          - condition: template
            value_template: >
              {{ states(room_state_entity) == 'auto_off' }}

          - condition: template
            value_template: >
              {{
                lux_limit_value | int(0) == 0
                or lux_sensor_entity == ''
                or states(lux_sensor_entity) | float(0) < lux_limit_value | float(0)
              }}

        sequence:
          - service: input_select.select_option
            target:
              entity_id: !input room_state
            data:
              option: "auto_on"

      # Motion while auto_dimmed -> auto_on
      - conditions:
          - condition: trigger
            id: motion_on

          - condition: template
            value_template: >
              {{ states(room_state_entity) == 'auto_dimmed' }}

        sequence:
          - service: input_select.select_option
            target:
              entity_id: !input room_state
            data:
              option: "auto_on"

      # No motion while auto_on -> auto_dimmed
      - conditions:
          - condition: trigger
            id: motion_off

          - condition: template
            value_template: >
              {{ states(room_state_entity) == 'auto_on' }}

        sequence:
          - service: input_select.select_option
            target:
              entity_id: !input room_state
            data:
              option: "auto_dimmed"

      # auto_dimmed timeout -> auto_off
      - conditions:
          - condition: trigger
            id: auto_dimmed_timeout

        sequence:
          - service: input_select.select_option
            target:
              entity_id: !input room_state
            data:
              option: "auto_off"

      #########################################################
      # LIGHT OUTPUTS
      #########################################################

      # auto_off
      - conditions:
          - condition: trigger
            id: room_state_changed

          - condition: template
            value_template: >
              {{ trigger.to_state.state == 'auto_off' }}

        sequence:
          - service: light.turn_off
            target: !input light_target
            data:
              transition: !input transition_time

      # manual_off
      - conditions:
          - condition: trigger
            id: room_state_changed

          - condition: template
            value_template: >
              {{ trigger.to_state.state == 'manual_off' }}

        sequence:
          - service: light.turn_off
            target: !input light_target
            data:
              transition: !input transition_time

      # auto_on
      - conditions:
          - condition: trigger
            id: room_state_changed

          - condition: template
            value_template: >
              {{ trigger.to_state.state == 'auto_on' }}

        sequence:
          - service: light.turn_on
            target: !input light_target
            data:
              brightness_pct: 100
              transition: !input transition_time

      # manual_on
      - conditions:
          - condition: trigger
            id: room_state_changed

          - condition: template
            value_template: >
              {{ trigger.to_state.state == 'manual_on' }}

        sequence:
          - service: light.turn_on
            target: !input light_target
            data:
              brightness_pct: 100
              transition: !input transition_time

      # auto_dimmed
      - conditions:
          - condition: trigger
            id: room_state_changed

          - condition: template
            value_template: >
              {{ trigger.to_state.state == 'auto_dimmed' }}

        sequence:
          - service: light.turn_on
            target: !input light_target
            data:
              brightness_pct: !input auto_dimmed_brightness
              transition: !input transition_time