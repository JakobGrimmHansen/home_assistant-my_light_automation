blueprint:
  name: Room Light State Machine v2
  description: >-
    Room lighting state machine with:
      - Manual toggle events
      - Motion activation
      - Automatic dimming after inactivity
      - Lux-aware motion activation

  domain: automation

  input:
    room_state:
      name: Room State Helper
      description: Input select containing Off, On and LowLights.
      selector:
        entity:
          domain: input_select

    light_target:
      name: Light Target
      selector:
        target:
          entity:
            domain: light

    motion_sensor:
      name: Motion Sensor or Group
      description: Motion sensor, occupancy sensor, or grouped sensor.
      selector:
        entity:
          filter:
            - domain: binary_sensor
            - domain: group

    no_motion_wait:
      name: No Motion Wait Time
      description: Seconds after motion stops before entering LowLights.
      default: 300
      selector:
        number:
          min: 0
          max: 3600
          unit_of_measurement: seconds
          mode: box

    lux_sensor:
      name: Lux Sensor
      description: Optional lux sensor used to prevent activation in bright rooms.
      default: ""
      selector:
        entity:
          domain: sensor

    lux_limit:
      name: Lux Limit
      description: Motion only turns lights on below this lux value. Set 0 to disable.
      default: 0
      selector:
        number:
          min: 0
          max: 10000
          mode: box

    low_brightness_value:
      name: Low Light Brightness %
      default: 20
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"

    toggle_event:
      name: Toggle Event Trigger(s)
      description: >-
        Event/device triggers that should toggle the room lights.
        Example: Zigbee button press, MQTT action event, remote click.
      selector:
        trigger:

mode: restart

variables:
  room_state_entity: !input room_state
  lux_sensor_entity: !input lux_sensor
  lux_limit: !input lux_limit
  low_brightness_value: !input low_brightness_value

trigger:
  # Motion detected
  - platform: state
    entity_id: !input motion_sensor
    to: "on"
    id: motion_on

  # No motion timeout
  - platform: state
    entity_id: !input motion_sensor
    to: "off"
    for:
      seconds: !input no_motion_wait
    id: motion_off

  # State helper changed
  - platform: state
    entity_id: !input room_state
    id: room_state_changed

  # Manual toggle button
  - platform: device
    device_id: !input toggle_device
    domain: mqtt
    type: action
    subtype: toggle_s2_action
    id: manual_toggle

condition: []

action:
  - choose:

      # Manual toggle while Off -> On
      - conditions:
          - condition: template
            value_template: >-
              {{
                trigger.platform != 'state'
                and states(room_state_entity) == 'Off'
              }}
        sequence:
          - service: input_select.select_option
            target:
              entity_id: !input room_state
            data:
              option: "On"

      # Manual toggle while On/LowLights -> Off
      - conditions:
          - condition: template
            value_template: >-
              {{
                trigger.platform != 'state'
                and states(room_state_entity) in ['On', 'LowLights']
              }}
        sequence:
          - service: input_select.select_option
            target:
              entity_id: !input room_state
            data:
              option: "Off"

      # Motion while Off -> On
      - conditions:
          - condition: trigger
            id: motion_on

          - condition: template
            value_template: >-
              {{ states(room_state_entity) == 'Off' }}

          - condition: template
            value_template: >-
              {{
                lux_limit | int(0) == 0
                or lux_sensor_entity == ''
                or states(lux_sensor_entity) | float(0) < lux_limit | float(0)
              }}
        sequence:
          - service: input_select.select_option
            target:
              entity_id: !input room_state
            data:
              option: "On"

      # No motion -> LowLights
      - conditions:
          - condition: trigger
            id: motion_off

          - condition: template
            value_template: >-
              {{ states(room_state_entity) == 'On' }}
        sequence:
          - service: input_select.select_option
            target:
              entity_id: !input room_state
            data:
              option: "LowLights"

      # Entered Off
      - conditions:
          - condition: trigger
            id: room_state_changed

          - condition: template
            value_template: >-
              {{ trigger.to_state.state == 'Off' }}
        sequence:
          - service: light.turn_off
            target: !input light_target

      # Entered On
      - conditions:
          - condition: trigger
            id: room_state_changed

          - condition: template
            value_template: >-
              {{ trigger.to_state.state == 'On' }}
        sequence:
          - service: light.turn_on
            target: !input light_target
            data:
              brightness_pct: 100

      # Entered LowLights
      - conditions:
          - condition: trigger
            id: room_state_changed

          - condition: template
            value_template: >-
              {{ trigger.to_state.state == 'LowLights' }}
        sequence:
          - service: light.turn_on
            target: !input light_target
            data:
              brightness_pct: !input low_brightness_value