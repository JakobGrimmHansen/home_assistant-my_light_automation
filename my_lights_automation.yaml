blueprint:
  name: Room Light State Machine v3
  description: >-
    Room lighting automation with:
      - Manual toggle button
      - Motion activation
      - Automatic dimming after inactivity
      - Automatic off after low-light timeout
      - Lux-aware motion activation

  domain: automation

  input:
    room_state:
      name: Room State Helper
      description: Input select containing Off, On and LowLights.
      selector:
        entity:
          domain: input_select

    light_target:
      name: Light Target
      selector:
        target:
          entity:
            domain: light

    motion_sensor:
      name: Motion Sensor or Group
      description: Motion sensor, occupancy sensor, or grouped sensor.
      selector:
        entity:
          filter:
            - domain: binary_sensor
            - domain: group

    toggle_device:
      name: Toggle Device
      description: Ubisys D1 dimmer/button device.
      selector:
        device: {}

    no_motion_wait:
      name: Time Before LowLights
      description: Seconds after motion stops before entering LowLights.
      default: 300
      selector:
        number:
          min: 0
          max: 3600
          unit_of_measurement: seconds
          mode: box

    low_lights_timeout:
      name: Time Before Off
      description: Seconds to stay in LowLights before turning Off.
      default: 120
      selector:
        number:
          min: 0
          max: 3600
          unit_of_measurement: seconds
          mode: box

    lux_sensor:
      name: Lux Sensor
      description: Optional lux sensor used to prevent activation in bright rooms.
      default: ""
      selector:
        entity:
          domain: sensor

    lux_limit:
      name: Lux Limit
      description: Motion only turns lights on below this lux value. Set 0 to disable.
      default: 0
      selector:
        number:
          min: 0
          max: 10000

    low_brightness_value:
      name: Low Light Brightness %
      default: 20
      selector:
        number:
          min: 1
          max: 100

mode: restart

variables:
  room_state_entity: !input room_state
  lux_sensor_entity: !input lux_sensor
  lux_limit: !input lux_limit

triggers:
  # Motion detected
  - trigger: state
    entity_id: !input motion_sensor
    to: "on"
    id: motion_on

  # No motion timeout -> LowLights
  - trigger: state
    entity_id: !input motion_sensor
    to: "off"
    for:
      seconds: !input no_motion_wait
    id: motion_off

  # LowLights timeout -> Off
  - trigger: state
    entity_id: !input room_state
    to: "LowLights"
    for:
      seconds: !input low_lights_timeout
    id: lowlights_timeout

  # State helper changed
  - trigger: state
    entity_id: !input room_state
    id: room_state_changed

  # Manual toggle button
  - trigger: device
    device_id: !input toggle_device
    domain: mqtt
    type: action
    subtype: toggle_s2
    id: manual_toggle

conditions: []

actions:
  - choose:

      # Manual toggle while Off -> On
      - conditions:
          - condition: trigger
            id: manual_toggle
          - condition: template
            value_template: >
              {{ states(room_state_entity) == 'Off' }}
        sequence:
          - action: input_select.select_option
            target:
              entity_id: !input room_state
            data:
              option: "On"

      # Manual toggle while On -> Off
      - conditions:
          - condition: trigger
            id: manual_toggle
          - condition: template
            value_template: >
              {{ states(room_state_entity) == 'On' }}
        sequence:
          - action: input_select.select_option
            target:
              entity_id: !input room_state
            data:
              option: "Off"

      # Manual toggle while LowLights -> On
      - conditions:
          - condition: trigger
            id: manual_toggle
          - condition: template
            value_template: >
              {{ states(room_state_entity) == 'LowLights' }}
        sequence:
          - action: input_select.select_option
            target:
              entity_id: !input room_state
            data:
              option: "On"

      # Motion while Off -> On
      - conditions:
          - condition: trigger
            id: motion_on
          - condition: template
            value_template: >
              {{ states(room_state_entity) == 'Off' }}

          - condition: template
            value_template: >
              {{
                lux_limit | int(0) == 0
                or lux_sensor_entity == ''
                or states(lux_sensor_entity) | float(0) < lux_limit | float(0)
              }}
        sequence:
          - action: input_select.select_option
            target:
              entity_id: !input room_state
            data:
              option: "On"

      # Motion while LowLights -> On
      - conditions:
          - condition: trigger
            id: motion_on
          - condition: template
            value_template: >
              {{ states(room_state_entity) == 'LowLights' }}
        sequence:
          - action: input_select.select_option
            target:
              entity_id: !input room_state
            data:
              option: "On"

      # No motion -> LowLights
      - conditions:
          - condition: trigger
            id: motion_off
          - condition: template
            value_template: >
              {{ states(room_state_entity) == 'On' }}
        sequence:
          - action: input_select.select_option
            target:
              entity_id: !input room_state
            data:
              option: "LowLights"

      # LowLights timeout -> Off
      - conditions:
          - condition: trigger
            id: lowlights_timeout
        sequence:
          - action: input_select.select_option
            target:
              entity_id: !input room_state
            data:
              option: "Off"

      # Entered Off
      - conditions:
          - condition: trigger
            id: room_state_changed
          - condition: template
            value_template: >
              {{ trigger.to_state.state == 'Off' }}
        sequence:
          - action: light.turn_off
            target: !input light_target

      # Entered On
      - conditions:
          - condition: trigger
            id: room_state_changed
          - condition: template
            value_template: >
              {{ trigger.to_state.state == 'On' }}
        sequence:
          - action: light.turn_on
            target: !input light_target
            data:
              brightness_pct: 100

      # Entered LowLights
      - conditions:
          - condition: trigger
            id: room_state_changed
          - condition: template
            value_template: >
              {{ trigger.to_state.state == 'LowLights' }}
        sequence:
          - action: light.turn_on
            target: !input light_target
            data:
              brightness_pct: !input low_brightness_value