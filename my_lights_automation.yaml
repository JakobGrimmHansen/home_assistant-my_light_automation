blueprint:
  name: Room Light State Machine v5
  description: >-
    Advanced room lighting state machine with:
      - Automatic motion lighting
      - Manual override states
      - Auto dimming
      - Triple-toggle gesture detection
      - Lux-aware activation

  domain: automation

  input:
    room_state:
      name: Room State Helper
      description: >-
        Input select containing:
          - auto_off
          - auto_on
          - auto_dimmed
          - manual_on
          - manual_off
      selector:
        entity:
          domain: input_select

    light_target:
      name: Light Target
      selector:
        target:
          entity:
            domain: light

    motion_sensor:
      name: Motion Sensor or Group
      selector:
        entity:
          filter:
            - domain: binary_sensor
            - domain: group

    toggle_device:
      name: Toggle Device
      description: Ubisys D1 device.
      selector:
        device: {}

    no_motion_wait:
      name: Time Before Auto Dimmed
      default: 300
      selector:
        number:
          min: 0
          max: 3600
          unit_of_measurement: seconds
          mode: box

    auto_off_wait:
      name: Time Before Auto Off
      default: 120
      selector:
        number:
          min: 0
          max: 3600
          unit_of_measurement: seconds
          mode: box

    lux_sensor:
      name: Lux Sensor
      default: ""
      selector:
        entity:
          domain: sensor

    lux_limit:
      name: Lux Limit
      default: 0
      selector:
        number:
          min: 0
          max: 10000

    auto_dimmed_brightness:
      name: Auto Dimmed Brightness %
      default: 20
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"

mode: restart

variables:
  room_state_entity: !input room_state
  lux_sensor_entity: !input lux_sensor
  lux_limit_value: !input lux_limit
  dimmed_brightness: !input auto_dimmed_brightness

trigger:
  # Motion detected
  - platform: state
    entity_id: !input motion_sensor
    to: "on"
    id: motion_on

  # No motion -> auto_dimmed
  - platform: state
    entity_id: !input motion_sensor
    to: "off"
    for:
      seconds: !input no_motion_wait
    id: motion_off

  # auto_dimmed timeout -> auto_off
  - platform: state
    entity_id: !input room_state
    to: "auto_dimmed"
    for:
      seconds: !input auto_off_wait
    id: auto_dimmed_timeout

  # State helper changed
  - platform: state
    entity_id: !input room_state
    id: room_state_changed

  # Single manual toggle
  - platform: device
    device_id: !input toggle_device
    domain: mqtt
    type: action
    subtype: toggle_s2
    id: manual_toggle

  # Dimmer hold gesture -> auto_dimmed
  - platform: device
    device_id: !input toggle_device
    domain: mqtt
    type: action
    subtype: brightness_move_up_s2
    id: auto_dimmed_trigger_up

  - platform: device
    device_id: !input toggle_device
    domain: mqtt
    type: action
    subtype: brightness_move_down_s2
    id: auto_dimmed_trigger_down

condition: []

action:
  - choose:

      #########################################################
      # DIMMER HOLD -> auto_dimmed
      #########################################################

      - conditions:
          - condition: or
            conditions:
              - condition: trigger
                id: auto_dimmed_trigger_up
              - condition: trigger
                id: auto_dimmed_trigger_down
        sequence:
          - service: input_select.select_option
            target:
              entity_id: !input room_state
            data:
              option: "auto_dimmed"

      #########################################################

      - conditions:
          - condition: trigger
            id: triple_toggle
        sequence:
          - wait_for_trigger:
              - platform: device
                device_id: !input toggle_device
                domain: mqtt
                type: action
                subtype: toggle_s2
            timeout: "00:00:01"
            continue_on_timeout: false

          - wait_for_trigger:
              - platform: device
                device_id: !input toggle_device
                domain: mqtt
                type: action
                subtype: toggle_s2
            timeout: "00:00:01"
            continue_on_timeout: false

          - service: input_select.select_option
            target:
              entity_id: !input room_state
            data:
              option: "auto_dimmed"

      #########################################################
      # MANUAL TRANSITIONS
      #########################################################

      # auto_on -> manual_off
      - conditions:
          - condition: trigger
            id: manual_toggle
          - condition: template
            value_template: >
              {{ states(room_state_entity) == 'auto_on' }}
        sequence:
          - service: input_select.select_option
            target:
              entity_id: !input room_state
            data:
              option: "manual_off"

      # auto_off -> manual_on
      - conditions:
          - condition: trigger
            id: manual_toggle
          - condition: template
            value_template: >
              {{ states(room_state_entity) == 'auto_off' }}
        sequence:
          - service: input_select.select_option
            target:
              entity_id: !input room_state
            data:
              option: "manual_on"

      # auto_dimmed -> manual_off
      - conditions:
          - condition: trigger
            id: manual_toggle
          - condition: template
            value_template: >
              {{ states(room_state_entity) == 'auto_dimmed' }}
        sequence:
          - service: input_select.select_option
            target:
              entity_id: !input room_state
            data:
              option: "manual_off"

      # manual_off -> manual_on
      - conditions:
          - condition: trigger
            id: manual_toggle
          - condition: template
            value_template: >
              {{ states(room_state_entity) == 'manual_off' }}
        sequence:
          - service: input_select.select_option
            target:
              entity_id: !input room_state
            data:
              option: "manual_on"

      # manual_on -> manual_off
      - conditions:
          - condition: trigger
            id: manual_toggle
          - condition: template
            value_template: >
              {{ states(room_state_entity) == 'manual_on' }}
        sequence:
          - service: input_select.select_option
            target:
              entity_id: !input room_state
            data:
              option: "manual_off"

      #########################################################
      # AUTO MOTION LOGIC
      #########################################################

      # Motion while auto_off -> auto_on
      - conditions:
          - condition: trigger
            id: motion_on

          - condition: template
            value_template: >
              {{ states(room_state_entity) == 'auto_off' }}

          - condition: template
            value_template: >
              {{
                lux_limit_value | int(0) == 0
                or lux_sensor_entity == ''
                or states(lux_sensor_entity) | float(0) < lux_limit_value | float(0)
              }}
        sequence:
          - service: input_select.select_option
            target:
              entity_id: !input room_state
            data:
              option: "auto_on"

      # Motion while auto_dimmed -> auto_on
      - conditions:
          - condition: trigger
            id: motion_on

          - condition: template
            value_template: >
              {{ states(room_state_entity) == 'auto_dimmed' }}
        sequence:
          - service: input_select.select_option
            target:
              entity_id: !input room_state
            data:
              option: "auto_on"

      # No motion while auto_on -> auto_dimmed
      - conditions:
          - condition: trigger
            id: motion_off

          - condition: template
            value_template: >
              {{ states(room_state_entity) == 'auto_on' }}
        sequence:
          - service: input_select.select_option
            target:
              entity_id: !input room_state
            data:
              option: "auto_dimmed"

      # auto_dimmed timeout -> auto_off
      - conditions:
          - condition: trigger
            id: auto_dimmed_timeout
        sequence:
          - service: input_select.select_option
            target:
              entity_id: !input room_state
            data:
              option: "auto_off"

      #########################################################
      # LIGHT OUTPUTS
      #########################################################

      # auto_off
      - conditions:
          - condition: trigger
            id: room_state_changed

          - condition: template
            value_template: >
              {{ trigger.to_state.state == 'auto_off' }}
        sequence:
          - service: light.turn_off
            target: !input light_target

      # manual_off
      - conditions:
          - condition: trigger
            id: room_state_changed

          - condition: template
            value_template: >
              {{ trigger.to_state.state == 'manual_off' }}
        sequence:
          - service: light.turn_off
            target: !input light_target

      # auto_on
      - conditions:
          - condition: trigger
            id: room_state_changed

          - condition: template
            value_template: >
              {{ trigger.to_state.state == 'auto_on' }}
        sequence:
          - service: light.turn_on
            target: !input light_target
            data:
              brightness_pct: 100

      # manual_on
      - conditions:
          - condition: trigger
            id: room_state_changed

          - condition: template
            value_template: >
              {{ trigger.to_state.state == 'manual_on' }}
        sequence:
          - service: light.turn_on
            target: !input light_target
            data:
              brightness_pct: 100

      # auto_dimmed
      - conditions:
          - condition: trigger
            id: room_state_changed

          - condition: template
            value_template: >
              {{ trigger.to_state.state == 'auto_dimmed' }}
        sequence:
          - service: light.turn_on
            target: !input light_target
            data:
              brightness_pct: !input auto_dimmed_brightness